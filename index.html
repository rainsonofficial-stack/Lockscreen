<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lockscreen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="no-select">

    <div id="setup-page" class="page">
        <h2>System Setup</h2>
        <div class="settings">
            <label>Success on Try #:</label><input type="number" id="success-try" value="1">
            <label>Peek on Try #:</label><input type="number" id="peek-try" value="1">
            <label>Cloud Send Try #:</label><input type="number" id="send-try" value="1">
            <label>Script URL:</label><input type="text" id="script-url" placeholder="https://script.google.com/...">
            
            <label style="margin-top: 15px; display: block;">Select Mode:</label>
            <div class="chip-grid">
                <div class="chip active" data-value="pin4">4-Digit PIN</div>
                <div class="chip" data-value="pin6">6-Digit PIN</div>
                <div class="chip" data-value="password">Keyboard</div>
                <div class="chip" data-value="pattern">3x3 Swipe</div>
            </div>
        </div>
        <button id="start-app">Launch Lockscreen</button>
    </div>

    <div id="lock-page" class="page hidden">
        <div id="lock-bg"></div>
        <div id="lock-content">
            <div id="lock-header">
                <div class="clock">9:41</div>
                <div class="date">Tuesday, January 20</div>
            </div>
            <div id="passcode-area">
                <p id="prompt">Enter Passcode</p>
                <div id="pin-dots" class="hidden"></div>
                <div id="password-tap-zone" class="hidden">
                    <input type="text" id="hidden-pass-input" autocomplete="off" placeholder="Password" enterkeyhint="done">
                </div>
                <canvas id="pattern-canvas" width="300" height="300" class="hidden"></canvas>
            </div>
            <div id="pin-pad" class="hidden">
                <div class="numpad">
                    <button class="num">1<span>&nbsp;</span></button>
                    <button class="num">2<span>ABC</span></button>
                    <button class="num">3<span>DEF</span></button>
                    <button class="num">4<span>GHI</span></button>
                    <button class="num">5<span>JKL</span></button>
                    <button class="num">6<span>MNO</span></button>
                    <button class="num">7<span>PQRS</span></button>
                    <button class="num">8<span>TUV</span></button>
                    <button class="num">9<span>WXYZ</span></button>
                    <div></div><button class="num">0<span>&nbsp;</span></button><div></div>
                </div>
            </div>
        </div>
        <div id="secret-trigger-lock" class="secret-zone"></div>
        <canvas id="peek-display" width="80" height="80" class="hidden"></canvas>
        <div id="active-dot"></div>
    </div>

    <div id="home-page" class="page hidden">
        <div id="home-status-bar">
            <div class="status-left clock">9:41</div>
            <div class="status-right">
                <div class="wifi-striped">
                    <svg viewBox="0 0 24 24" fill="white">
                        <path d="M12 21l-12-14.33c.45-.34 4.93-4 12-4s11.55 3.66 12 4l-12 14.33z" fill-opacity=".3"/>
                        <path d="M12 21l-12-14.33c.45-.34 4.93-4 12-4s11.55 3.66 12 4l-12 14.33z"/>
                        <rect x="3.5" y="0" width="1" height="24" fill="black" fill-opacity="0.4" />
                        <rect x="8.5" y="0" width="1" height="24" fill="black" fill-opacity="0.4" />
                        <rect x="13.5" y="0" width="1" height="24" fill="black" fill-opacity="0.4" />
                        <rect x="18.5" y="0" width="1" height="24" fill="black" fill-opacity="0.4" />
                    </svg>
                </div>
                <div class="signal-striped"></div>
                <div class="battery-ico">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <div class="carousel-container" id="carousel-container">
            <div class="carousel" id="carousel">
                <div class="slide"><img src="homepage3.jpg"></div>
                <div class="slide"><img src="homepage1.jpg"></div>
                <div class="slide"><img src="homepage2.jpg"></div>
                <div class="slide"><img src="homepage3.jpg"></div>
                <div class="slide"><img src="homepage1.jpg"></div>
            </div>
        </div>
        <div id="secret-trigger-home" class="secret-zone"></div>
        <canvas id="peek-display-home" width="80" height="80" class="hidden"></canvas>
    </div>

    <audio id="unlock-sound" src="unlock.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
