<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lockscreen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="no-select">

    <div id="setup-page" class="page">
        <h2>System Setup</h2>

        <div class="settings">
            <label>Success on Try #:</label><input type="number" id="success-try" value="1">
            <label>Peek on Try #:</label><input type="number" id="peek-try" value="1">
            <label>Cloud Send Try #:</label><input type="number" id="send-try" value="1">
            <label>Script URL:</label><input type="text" id="script-url" placeholder="https://script.google.com/...">
        </div>

        <div id="mode-chips">
            <button class="chip active" data-mode="pin4">4-Digit PIN</button>
            <button class="chip" data-mode="pin6">6-Digit PIN</button>
            <button class="chip" data-mode="password">Password</button>
            <button class="chip" data-mode="pattern">Pattern</button>
        </div>

        <button id="start-app">Launch Lockscreen</button>
    </div>

    <div id="lock-page" class="page hidden">
        <div id="lock-bg"></div>

        <div id="lock-content">
            <div id="lock-header">
                <div class="clock">9:41</div>
                <div class="date">Tuesday, January 20</div>
            </div>

            <div id="passcode-area">
                <p id="prompt">Enter Passcode</p>

                <div id="pin-dots" class="hidden"></div>

                <div id="password-tap-zone" class="hidden">
                    <input type="text" id="hidden-pass-input" autocomplete="off">
                </div>

                <canvas id="pattern-canvas" width="300" height="300" class="hidden"></canvas>
            </div>

            <div id="pin-pad" class="hidden">
                <div class="numpad">
                    <button class="num"><span>1</span></button>
                    <button class="num"><span>2</span><small>abc</small></button>
                    <button class="num"><span>3</span><small>def</small></button>
                    <button class="num"><span>4</span><small>ghi</small></button>
                    <button class="num"><span>5</span><small>jkl</small></button>
                    <button class="num"><span>6</span><small>mno</small></button>
                    <button class="num"><span>7</span><small>pqrs</small></button>
                    <button class="num"><span>8</span><small>tuv</small></button>
                    <button class="num"><span>9</span><small>wxyz</small></button>
                    <div></div>
                    <button class="num"><span>0</span></button>
                    <div></div>
                </div>
            </div>
        </div>

        <div id="secret-trigger-lock" class="secret-zone"></div>
        <canvas id="peek-display" width="80" height="80" class="hidden"></canvas>
        <div id="active-dot"></div>
    </div>

    <div id="home-page" class="page hidden">
        <div class="carousel-container">
            <div class="carousel">
                <div class="slide"><img src="homepage1.jpg"></div>
                <div class="slide"><img src="homepage2.jpg"></div>
                <div class="slide"><img src="homepage3.jpg"></div>
            </div>
        </div>
        <div id="secret-trigger-home" class="secret-zone"></div>
        <canvas id="peek-display-home" width="80" height="80" class="hidden"></canvas>
    </div>

    <audio id="unlock-sound" src="unlock.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
