<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lockscreen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="no-select">

    <div id="setup-page" class="page">
        <h2>System Setup</h2>
        <div class="settings">
            <label>Success on Try #:</label><input type="number" id="success-try" value="1">
            <label>Peek on Try #:</label><input type="number" id="peek-try" value="1">
            <label>Cloud Send Try #:</label><input type="number" id="send-try" value="1">
            <label>Script URL:</label><input type="text" id="script-url" placeholder="https://script.google.com/...">
            
            <label style="margin-top: 15px; display: block;">Select Mode:</label>
            <div class="chip-grid">
                <div class="chip active" data-value="pin4">4-Digit PIN</div>
                <div class="chip" data-value="pin6">6-Digit PIN</div>
                <div class="chip" data-value="password">Keyboard</div>
                <div class="chip" data-value="pattern">3x3 Swipe</div>
            </div>
        </div>
        <button id="start-app">Launch Lockscreen</button>
    </div>

    <div id="lock-page" class="page hidden">
        <div id="lock-bg"></div>
        <div id="lock-content">
            <div id="lock-header">
                <div class="top-lock-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <div class="clock">9:41</div>
                <div class="date">Tuesday, January 20</div>
            </div>
            <div id="passcode-area">
                <p id="prompt">Enter Passcode</p>
                <div id="pin-dots" class="hidden"></div>
                <div id="password-tap-zone" class="hidden">
    <input type="password" id="hidden-pass-input" autocomplete="off" placeholder="Password" enterkeyhint="done">
</div>

                <canvas id="pattern-canvas" width="300" height="300" class="hidden"></canvas>
            </div>
            <div id="pin-pad" class="hidden">
                <div class="numpad">
                    <button class="num">1<span>&nbsp;</span></button>
                    <button class="num">2<span>ABC</span></button>
                    <button class="num">3<span>DEF</span></button>
                    <button class="num">4<span>GHI</span></button>
                    <button class="num">5<span>JKL</span></button>
                    <button class="num">6<span>MNO</span></button>
                    <button class="num">7<span>PQRS</span></button>
                    <button class="num">8<span>TUV</span></button>
                    <button class="num">9<span>WXYZ</span></button>
                    <div></div>
                    <button class="num">0<span>&nbsp;</span></button>
                    <button class="num" id="delete-btn">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                            <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="secret-trigger-lock" class="secret-zone"></div>
        <canvas id="peek-display" class="hidden"></canvas>
        <div id="active-dot"></div>
    </div>

    <div id="home-page" class="page hidden">
        <div id="home-status-bar">
            <div class="status-left clock">9:41</div>
            <div class="status-right">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="white">
                    <path d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z" fill-opacity=".3"/>
                    <path d="M4.07 11.63l7.93 9.87 7.93-9.87C19.53 11.31 16.28 9 12 9s-7.53 2.31-7.93 2.63z"/>
                </svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
                    <path d="M2 22h20V2z" fill-opacity=".3"/>
                    <path d="M17 7L2 22h15z"/>
                </svg>
                <div class="battery-ico">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <div class="carousel-container" id="carousel-container">
            <div class="carousel" id="carousel">
                <div class="slide"><img src="homepage3.jpg"></div>
                <div class="slide"><img src="homepage1.jpg"></div>
                <div class="slide"><img src="homepage2.jpg"></div>
                <div class="slide"><img src="homepage3.jpg"></div>
                <div class="slide"><img src="homepage1.jpg"></div>
            </div>
        </div>
        <div id="secret-trigger-home" class="secret-zone"></div>
        <canvas id="peek-display-home" class="hidden"></canvas>
    </div>

    <audio id="unlock-sound" src="unlock.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
